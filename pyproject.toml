[project]
name = "pulumi-aws-static-site"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
# the uv pin: enforced by uv itself, read by setup-uv and by the Makefile's anchored sed (§5) — keep the value alone on its line
required-version = "==0.12.15"

[tool.uv.workspace]
# packages/static-site is the one built package; the other four are virtual (no [build-system]).
members = [
    "packages/static-site",
    "bootstrap",
    "envs",
    "policy",
    "tests/offline",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# `static_site` lives under packages/static-site/src; naming it here keeps the import sorter (I) treating it as first-party
# from every Pulumi project directory, not only from inside the package.
src = [".", "packages/static-site/src"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes; I: import order; N: pep8-naming (the snake_case rule tflint used to enforce);
# UP: modern syntax for the pinned interpreter; B: bugbear; SIM: simplify; RUF: ruff's own rules.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/offline"]
